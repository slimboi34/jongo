name: Publish to PyPI

# Publishes when you create a GitHub release (or run this workflow by hand).
# Uses PyPI trusted publishing over OIDC, so no API token is stored anywhere.
# PyPI trusts this file name and the "pypi" environment: don't rename either.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade build pytest -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Check the version matches the tag
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import jongo; print(jongo.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || {
            echo "jongo.__version__ ($version) doesn't match the tag ($tag)"; exit 1;
          }

      - name: Build the wheel and sdist
        run: python -m build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing (and its attestations)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
