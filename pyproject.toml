[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jongo"
version = "0.2.3"
description = "A full-stack Python web framework: routes, server code and reactive UI in one language."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Joshua Harty" }]
keywords = ["web", "framework", "fullstack", "frontend", "orm", "wsgi", "transpiler", "ssr"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/slimboi34/jongo"
Repository = "https://github.com/slimboi34/jongo"
Issues = "https://github.com/slimboi34/jongo/issues"

[project.scripts]
jongo = "jongo.cli:main"

[tool.setuptools.packages.find]
include = ["jongo*"]

[tool.setuptools.package-data]
jongo = ["compiler/*.js", "scaffold/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
