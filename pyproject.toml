[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jongo"
version = "0.1.0"
description = "A full-stack Python web framework: routes, server code and reactive UI in one language."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Framework :: Jongo",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

[project.scripts]
jongo = "jongo.cli:main"

[tool.setuptools.packages.find]
include = ["jongo*"]

[tool.setuptools.package-data]
jongo = ["compiler/*.js", "scaffold/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
